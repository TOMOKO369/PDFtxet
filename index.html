<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Text Converter</title>
    <meta name="description" content="ブラウザ内で完結する安全なPDFテキスト抽出ツール。アップロード不要で高速に変換します。">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --secondary-color: #475569;
            --secondary-hover: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
        }

        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary-color);
            background: rgba(59, 130, 246, 0.1);
        }

        .dropzone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #94a3b8;
        }

        .dropzone-text {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .dropzone-subtext {
            font-size: 0.9rem;
            color: #64748b;
        }

        input[type="file"] {
            display: none;
        }

        .result-container {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.4s ease-out;
        }

        .result-container.active {
            display: flex;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            color: var(--text-color);
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .file-info {
            font-size: 0.9rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: var(--secondary-color);
        }

        button.secondary:hover {
            background: var(--secondary-hover);
        }

        button.success {
            background: var(--success-color);
        }
        
        button.success:hover {
            background: #059669;
        }

        .loader-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin: 3rem 0;
        }

        .loader-wrapper.active {
            display: flex;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid var(--border-color);
            border-bottom-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                flex-direction: column;
            }
            button {
                justify-content: center;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>PDF to Text</h1>
        <p class="subtitle">ブラウザ内で完結・安全にPDFからテキストを抽出します</p>

        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">📄</div>
            <div class="dropzone-text">PDFファイルをここにドロップ</div>
            <div class="dropzone-subtext">または クリックしてファイルを選択</div>
            <input type="file" id="fileInput" accept="application/pdf">
        </div>

        <div class="loader-wrapper" id="loaderWrapper">
            <div class="loader"></div>
            <p>テキストを抽出中...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="controls">
                <div class="file-info" id="fileInfo">
                    <!-- File info will appear here -->
                </div>
            </div>
            
            <textarea id="resultText" placeholder="抽出されたテキストがここに表示されます..." readonly></textarea>
            
            <div class="controls">
                <button id="resetBtn" class="secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    別のファイルを選択
                </button>
                <div class="actions">
                    <button id="copyBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        コピーする
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load PDF.js -->
    <script type="module">
        import * as pdfjsLib from 'https://mozilla.github.io/pdf.js/build/pdf.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.mjs';

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const loaderWrapper = document.getElementById('loaderWrapper');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');
        const fileInfo = document.getElementById('fileInfo');

        // Handle file selection
        dropzone.addEventListener('click', () => fileInput.click());

        // Handle drag and drop
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.type === 'application/pdf') {
                    processFile(file);
                } else {
                    alert('PDFファイルを選択してください。');
                }
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        async function processFile(file) {
            // Update UI state
            dropzone.style.display = 'none';
            resultContainer.classList.remove('active');
            loaderWrapper.classList.add('active');
            resultText.value = '';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                let fullText = '';
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    let lastY, text = '';
                    for (let item of textContent.items) {
                        if (lastY == item.transform[5] || !lastY) {
                            text += item.str;
                        } else {
                            text += '\n' + item.str;
                        }
                        lastY = item.transform[5];
                    }
                    
                    fullText += text + '\n\n';
                }

                // Show results
                resultText.value = fullText.trim();
                fileInfo.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> ${file.name} (${pdf.numPages} ページ)`;
                
                loaderWrapper.classList.remove('active');
                resultContainer.classList.add('active');
                
            } catch (error) {
                console.error('Error parsing PDF:', error);
                alert('PDFの読み込みに失敗しました。');
                
                // Reset UI
                dropzone.style.display = 'block';
                loaderWrapper.classList.remove('active');
            }
            
            // Clear input so the same file can be selected again
            fileInput.value = '';
        }

        // Copy button functionality
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultText.value);
                const originalHtml = copyBtn.innerHTML;
                copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> コピーしました！';
                copyBtn.classList.add('success');
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.classList.remove('success');
                }, 2000);
            } catch (err) {
                alert('コピーに失敗しました。');
            }
        });

        // Reset button functionality
        resetBtn.addEventListener('click', () => {
            resultContainer.classList.remove('active');
            dropzone.style.display = 'block';
        });
    </script>
</body>
</html>
